<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>점검 일정 D-Day 보드</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1f2430; --sub:#6b7280;
    --border:#e2e6ee; --accent:#2f4bff;
    --red:#e5484d; --red-bg:#ffecec;
    --yellow:#d9a400; --yellow-bg:#fff8e1;
    --green:#1a9e5c; --green-bg:#e9f9ef;
    --gray:#9aa1ac; --gray-bg:#f0f1f4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text); padding:32px;
  }
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--sub); font-size:13px; margin-bottom:24px;}
  .panel{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px; margin-bottom:24px;
  }
  .panel h2{font-size:15px; margin:0 0 14px;}
  .form-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:12px; color:var(--sub);}
  input[type=text], input[type=date], select{
    padding:8px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; min-width:150px;
  }
  button{
    padding:9px 16px; border:none; border-radius:8px; background:var(--accent);
    color:#fff; font-size:14px; cursor:pointer;
  }
  button:hover{opacity:.9;}
  button.secondary{background:#fff; color:var(--sub); border:1px solid var(--border);}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
  }
  .card{
    border-radius:12px; padding:16px; border:1px solid var(--border);
    position:relative; background:var(--card);
  }
  .card.red{background:var(--red-bg); border-color:#f7c9cb;}
  .card.yellow{background:var(--yellow-bg); border-color:#f0e0a6;}
  .card.green{background:var(--green-bg); border-color:#bfe8cf;}
  .card.gray{background:var(--gray-bg); border-color:var(--border);}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start;}
  .card .name{font-size:16px; font-weight:600;}
  .card .date{font-size:12px; color:var(--sub); margin-top:2px;}
  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:5px 10px;
    border-radius:20px; font-size:13px; font-weight:600; margin-top:12px;
  }
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .red .dot{background:var(--red);} .red .badge{color:var(--red); background:#fff;}
  .yellow .dot{background:var(--yellow);} .yellow .badge{color:var(--yellow); background:#fff;}
  .green .dot{background:var(--green);} .green .badge{color:var(--green); background:#fff;}
  .gray .dot{background:var(--gray);} .gray .badge{color:var(--gray); background:#fff;}
  .del{
    background:none; border:none; color:var(--sub); font-size:16px; cursor:pointer;
    padding:0 4px; line-height:1;
  }
  .del:hover{color:var(--red);}
  .empty{color:var(--sub); font-size:14px; padding:20px; text-align:center;}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--sub); margin-top:8px; flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
</style>
</head>
<body>

<h1>점검 일정 D-Day 보드</h1>
<div class="sub">고객사별 다음 점검일을 입력하면 D-Day 신호등으로 표시합니다. (모든 데이터는 브라우저에 저장, 외부 전송 없음)</div>

<div class="panel">
  <h2>고객사 / 점검일 추가</h2>
  <div class="form-row">
    <div class="field">
      <label>고객사명</label>
      <input type="text" id="custName" placeholder="예: OO물산">
    </div>
    <div class="field">
      <label>다음 점검일</label>
      <input type="date" id="custDate">
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <input type="text" id="custMemo" placeholder="예: 본사 3층 IDF">
    </div>
    <button onclick="addCustomer()">추가</button>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--red)"></span> D-7 이내 (긴급)</span>
    <span><span class="dot" style="background:var(--yellow)"></span> D-8~30 (주의)</span>
    <span><span class="dot" style="background:var(--green)"></span> D-31 이상 (여유)</span>
    <span><span class="dot" style="background:var(--gray)"></span> 기한 초과 / 미지정</span>
  </div>
</div>

<div class="panel">
  <h2>고객사 현황</h2>
  <div class="grid" id="boardGrid"></div>
</div>

<script>
const STORAGE_KEY = "ddayBoardCustomers";

function loadCustomers(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){ return []; }
}
function saveCustomers(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function daysUntil(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

function statusOf(d){
  if(d === null || isNaN(d)) return "gray";
  if(d < 0) return "gray";
  if(d <= 7) return "red";
  if(d <= 30) return "yellow";
  return "green";
}

function ddayLabel(d){
  if(d === null || isNaN(d)) return "날짜 미지정";
  if(d < 0) return `기한 초과 (D+${Math.abs(d)})`;
  if(d === 0) return "오늘 (D-Day)";
  return `D-${d}`;
}

function render(){
  const list = loadCustomers();
  const grid = document.getElementById("boardGrid");
  grid.innerHTML = "";

  if(list.length === 0){
    grid.innerHTML = `<div class="empty">등록된 고객사가 없습니다. 위에서 추가해 주세요.</div>`;
    return;
  }

  const sorted = [...list].sort((a,b) => {
    const da = a.date ? daysUntil(a.date) : Infinity;
    const db = b.date ? daysUntil(b.date) : Infinity;
    return da - db;
  });

  sorted.forEach(item => {
    const d = item.date ? daysUntil(item.date) : null;
    const status = statusOf(d);
    const card = document.createElement("div");
    card.className = "card " + status;
    card.innerHTML = `
      <div class="top">
        <div>
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="date">${item.date ? item.date : "날짜 미지정"}${item.memo ? " · " + escapeHtml(item.memo) : ""}</div>
        </div>
        <button class="del" title="삭제" onclick="removeCustomer('${item.id}')">✕</button>
      </div>
      <div class="badge"><span class="dot"></span>${ddayLabel(d)}</div>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function addCustomer(){
  const nameEl = document.getElementById("custName");
  const dateEl = document.getElementById("custDate");
  const memoEl = document.getElementById("custMemo");

  const name = nameEl.value.trim();
  const date = dateEl.value;
  const memo = memoEl.value.trim();

  if(!name){
    alert("고객사명을 입력해 주세요.");
    return;
  }

  const list = loadCustomers();
  list.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    name, date, memo
  });
  saveCustomers(list);

  nameEl.value = "";
  dateEl.value = "";
  memoEl.value = "";
  render();
}

function removeCustomer(id){
  const list = loadCustomers().filter(c => c.id !== id);
  saveCustomers(list);
  render();
}

render();
</script>
</body>
</html>
